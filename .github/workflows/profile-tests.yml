name: Profile regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check static/lib/main.js
      - run: node --test test/profile-view.test.cjs
